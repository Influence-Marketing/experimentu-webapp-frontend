name: Guest flow end to end

# Builds and starts the Next.js guest site on the runner and runs the Playwright suite in e2e/
# against it, with the guest site talking to the deployed backend (not a checkout of it: the
# backend repository is private and the runner has no token for it). Each run creates a few
# test guests there with e2e-<timestamp>@example.com addresses; the roster should ignore them.
#
# The backend must be on scoring config 2.0.0 (EXPU_SCORING_VERSION / EXPU_SCORE_CONTENT_VERSION
# set on the server) and allow http://localhost:3000 in CORS_ALLOWED_ORIGINS. The preflight step
# checks the first and says what to change when it is not.
#
# Repository variable E2E_API_BASE_URL points the suite at another backend (staging, a preview).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.E2E_API_BASE_URL || 'https://scoreu-backend.on-forge.com/' }}
      # The built-in TextCaptcha accepts this fixed code, so the suite can pass the intake. Never set in production.
      NEXT_PUBLIC_CAPTCHA_TEST_CODE: TEST2
    steps:
      - name: Check out the guest site
        uses: actions/checkout@v4

      - name: Check the backend is reachable and on scoring config 2.0.0
        run: |
          url="${NEXT_PUBLIC_API_BASE_URL%/}/api/scoring-config"
          if ! body=$(curl -sf --max-time 30 -H "Accept: application/json" "$url"); then
            echo "::error title=Backend unreachable::GET $url failed. The suite needs the deployed backend; set the repository variable E2E_API_BASE_URL to point at a reachable one."
            exit 1
          fi
          echo "$body" | head -c 300; echo
          if ! echo "$body" | grep -q '"schema":2'; then
            version=$(echo "$body" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            echo "::error title=Backend not on scoring 2.0.0::$url reports scoring config ${version:-unknown}. The guest site captures the 2.0.0 fields, so the suite cannot run against it. On that server set EXPU_SCORING_VERSION=2.0.0 and EXPU_SCORE_CONTENT_VERSION=2.0.0 (and EXPU_NERVOUS_SYSTEM), run php artisan config:clear, then re-run this job."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install guest site dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build and start the guest site
        run: |
          npm run build
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the guest flow suite
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            next.log
          retention-days: 7
